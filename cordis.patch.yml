# ============================================================================
# dsh-share-card —— DSH bundle patch
# ============================================================================
# 挂载声明：DSH 启动时把本插件插入 profile 配置树。
# 宿主半 apply() 是空实现（本插件只贡献浏览器表现），浏览器半通过
# package.json 的 exports["./client"] + dsh.client 声明交给 client-modules 服务下发。
#
# 安装（本地开发）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-share-card
      name: dsh-share-card
